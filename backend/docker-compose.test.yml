services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: winlance_test
      POSTGRES_USER: winlance
      POSTGRES_PASSWORD: winlance
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U winlance -d winlance_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
