<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Winlance</title>
    <script>
      (function () {
        try {
          var key = 'winlance.theme'
          var stored = localStorage.getItem(key)
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', theme)
          if (theme === 'dark') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      .app-initial-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: var(--wl-canvas, #07131b);
        color: var(--wl-ink, #e8f1f6);
        font-family: 'DM Sans', system-ui, sans-serif;
      }
      .app-initial-badge {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background-color: var(--wl-accent, #3dd68c);
        color: var(--wl-accent-foreground, #042015);
        font-family: 'Syne', sans-serif;
        font-weight: 700;
        font-size: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 16px var(--wl-glow, rgba(61, 214, 140, 0.25));
      }
      .app-initial-title {
        font-family: 'Syne', sans-serif;
        font-weight: 700;
        font-size: 20px;
        letter-spacing: -0.02em;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-initial-splash">
        <div class="app-initial-badge">W</div>
        <div class="app-initial-title">Winlance</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
