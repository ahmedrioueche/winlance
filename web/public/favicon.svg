<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1926"/>
      <stop offset="100%" stop-color="#050e15"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3dd68c"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#3dd68c"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Tile -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="120" stroke="url(#accentGrad)" stroke-width="12" stroke-opacity="0.35"/>

  <!-- Winlance Geometric Monogram / Victory Lance Symbol -->
  <g filter="url(#glow)">
    <!-- Left Pillar -->
    <path d="M112 152 L172 152 L220 344 L160 344 Z" fill="url(#accentGrad)"/>
    <!-- Central Upward Victory Lance -->
    <path d="M216 344 L256 120 L296 344 L256 392 Z" fill="url(#glowGrad)"/>
    <!-- Right Pillar -->
    <path d="M292 344 L340 152 L400 152 L352 344 Z" fill="url(#accentGrad)"/>
  </g>
</svg>